<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Study App</title>

    <link rel="stylesheet"
          th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <!-- タイトル -->
    <div class="header">

        <h1>Study Tracker</h1>

        <p>
            毎日の学習を記録して
            成長を見える化
        </p>

    </div>

    <!-- 統計カード -->
    <div class="summary-grid">

        <div class="summary-card">

            <h2>今日</h2>

            <p>
                <span th:text="${todayTotal}">
                    0
                </span>
                分
            </p>

        </div>

        <div class="summary-card">

            <h2>今週</h2>

            <p>
                <span th:text="${weekTotal}">
                    0
                </span>
                分
            </p>

        </div>

        <div class="summary-card">

            <h2>今月</h2>

            <p>
                <span th:text="${monthTotal}">
                    0
                </span>
                分
            </p>

        </div>

    </div>

    <!-- カレンダー -->
    <div class="calendar-box">

        <h2>学習カレンダー</h2>

        <input type="date"
               class="calendar">

    </div>

    <!-- 登録フォーム -->
    <div class="form-box">

        <h2>学習記録追加</h2>

        <form th:action="@{/save}"
              method="post">

            <input type="text"
                   name="subject"
                   placeholder="教科名"
                   required>

            <input type="number"
                   name="studyTime"
                   placeholder="勉強時間（分）"
                   required>

            <textarea name="memo"
                      placeholder="メモ"></textarea>

            <button type="submit">
                記録する
            </button>

        </form>

    </div>

    <!-- 一覧 -->
    <div class="table-box">

        <h2>学習履歴</h2>

        <table>

            <thead>

            <tr>
                <th>日付</th>
                <th>教科</th>
                <th>時間</th>
                <th>メモ</th>
                <th>削除</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="record : ${records}">

                <td th:text="${record.studyDate}">
                    2026-01-01
                </td>

                <td th:text="${record.subject}">
                    Java
                </td>

                <td>
                    <span th:text="${record.studyTime}">
                        60
                    </span>
                    分
                </td>

                <td th:text="${record.memo}">
                    メモ
                </td>

                <td>

                    <form th:action="@{/delete}"
                          method="post">

                        <input type="hidden"
                               name="id"
                               th:value="${record.id}">

                        <button type="submit"
                                class="delete-btn">

                            削除

                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
