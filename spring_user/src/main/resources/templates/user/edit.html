<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="http://www.thymeleaf.org">
<head
  th:replace="common/head :: head_fragment(title = 'ユーザー情報編集', scripts = ~{::script}, links = ~{::link})"></head>
<body>
  <div class="container">
    <div th:if="${validationError}" th:each="error : ${validationError}">
      <label class="text-danger" th:text="${error}"></label>
    </div>
    <div th:if="${businessError}">
      <label class="text-danger" th:text="${businessError}"></label>
    </div>
    <h1>ユーザー情報編集</h1>


    <form th:action="@{/user/update}" th:object="${userUpdateRequest}" th:method="post">
      <input type="hidden" th:field="*{id}" />
      <div>
        <div class="form-group">
          <div class="col-2 pt-3">名前<span class="text-danger">※</span></div>
          <div class="col py-2">
            <input type="text" class="form-control" th:field="*{name}">
          </div>
        </div>
        <div class="form-group">
          <div class="col-2 pt-3">住所<span class="text-danger">※</span></div>
          <div class="col py-2">
            <input type="text" class="form-control" th:field="*{address}">
          </div>
        </div>
        <div class="form-group">
          <div class="col-2 pt-3">電話番号<span class="text-danger">※</span></div>
          <div class="col py-2">
            <input type="text" class="form-control" th:field="*{phone}">
          </div>
        </div>
        <div class="form-group">
          <div class="col-2 pt-3">メールアドレス<span class="text-danger">※</span></div>
          <div class="col py-2">
            <input type="text" class="form-control" th:field="*{email}">
          </div>
        </div>
        <div class="form-group">
          <div class="col-2 pt-3">性別<span class="text-danger">※</span></div>
          <div class="col py-2">
            <select th:field="*{genderId}" class="form-control">
              <option value="">選択してください</option>
              <option th:each="gender : ${genderMap}" th:value="${gender.key}" th:text="${gender.value}"></option>
            </select>
          </div>
        </div>
      </div>
      <br />
      <div class="text-center">
        <input type="submit" class="btn btn-primary" value="　保存　">
        <a th:href="@{/user/{id}(id=*{id})}" class="btn btn-secondary">キャンセル</a>
      </div>
    </form>
  </div>
</body>
</html>
