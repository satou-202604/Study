<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${orderForm.orderId == null} ? '受注登録' : '受注編集'">
        受注登録
    </title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <div class="page-header">
        <h1 th:text="${orderForm.orderId == null} ? '受注登録' : '受注編集'">
            受注登録
        </h1>
    </div>

    <form
        th:action="${orderForm.orderId == null}
            ? @{/orders}
            : @{/orders/{id}/update(id=${orderForm.orderId})}"
        th:object="${orderForm}"
        method="post">

        <div class="form-group">
            <label for="orderNo">受注番号</label>

            <input id="orderNo"
                   type="text"
                   th:field="*{orderNo}"
                   class="form-control">

            <div class="form-error"
                 th:if="${#fields.hasErrors('orderNo')}"
                 th:errors="*{orderNo}">
            </div>
        </div>

        <div class="form-group">
            <label for="customerName">購入者名</label>

            <input id="customerName"
                   type="text"
                   th:field="*{customerName}"
                   class="form-control">

            <div class="form-error"
                 th:if="${#fields.hasErrors('customerName')}"
                 th:errors="*{customerName}">
            </div>
        </div>

        <div class="form-group">
            <label for="productId">商品</label>

            <select id="productId"
                    th:field="*{productId}"
                    class="form-control">

                <option value="">選択してください</option>

                <option th:each="entry : ${products}"
                        th:value="${entry.key}"
                        th:text="${entry.value.productName}">
                </option>

            </select>

            <div class="form-error"
                 th:if="${#fields.hasErrors('productId')}"
                 th:errors="*{productId}">
            </div>
        </div>

        <div class="form-group">
            <label for="quantity">数量</label>

            <input id="quantity"
                   type="number"
                   th:field="*{quantity}"
                   min="1"
                   max="999"
                   class="form-control">

            <div class="form-error"
                 th:if="${#fields.hasErrors('quantity')}"
                 th:errors="*{quantity}">
            </div>
        </div>

        <div class="form-group">
            <label for="orderStatus">ステータス</label>

            <select id="orderStatus"
                    th:field="*{orderStatus}"
                    class="form-control">

                <option value="">選択してください</option>
                <option value="受付">受付</option>
                <option value="処理中">処理中</option>
                <option value="発送済み">発送済み</option>
                <option value="完了">完了</option>

            </select>

            <div class="form-error"
                 th:if="${#fields.hasErrors('orderStatus')}"
                 th:errors="*{orderStatus}">
            </div>
        </div>

        <div class="form-group">
            <label for="orderDate">受注日</label>

            <input id="orderDate"
                   type="date"
                   th:field="*{orderDate}"
                   class="form-control">

            <div class="form-error"
                 th:if="${#fields.hasErrors('orderDate')}"
                 th:errors="*{orderDate}">
            </div>
        </div>

        <div class="form-group">
            <label for="deliveryDate">希望納期</label>

            <input id="deliveryDate"
                   type="date"
                   th:field="*{deliveryDate}"
                   class="form-control">

            <div class="form-error"
                 th:if="${#fields.hasErrors('deliveryDate')}"
                 th:errors="*{deliveryDate}">
            </div>
        </div>

        <div class="message error-message"
             th:if="${errorMessage}">
            <p th:text="${errorMessage}"></p>
        </div>

        <div class="form-actions">

            <button type="submit"
                    class="btn btn-primary"
                    th:text="${orderForm.orderId == null} ? '登録' : '更新'">
                登録
            </button>

            <a th:href="@{/orders}"
               class="btn btn-back">
                戻る
            </a>

        </div>

    </form>

</div>

</body>
</html>
